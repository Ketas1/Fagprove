  #     Auth0__Domain: ${AUTH0_DOMAIN}
  #     Auth0__Audience: ${AUTH0_AUDIENCE}
  #     Cors__AllowedOrigins: http://localhost:${FRONTEND_PORT:-3000}
  #   ports:
  #     - '${BACKEND_PORT:-5080}:8080'
  #
  # --- Uncomment once frontend/ is scaffolded and has a Dockerfile ------------
