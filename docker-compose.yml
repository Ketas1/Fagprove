# Sport For Alle - local development stack
#
# Right now only the database service is active, which is what day 2 needs:
# it lets EF Core migrations run and the API be developed against a real
# PostgreSQL before anything is containerised.
#
#   docker compose up -d db
#
# The api and frontend services below are written and ready. Uncomment each one
# once that project has been scaffolded and has a Dockerfile, at which point
# `docker compose up --build` starts all three layers together.

services:
  db:
    image: postgres:17-alpine
    container_name: sportforalle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sportforalle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-sportforalle}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The api service waits on this, so it does not start before the database
      # is actually accepting connections.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sportforalle} -d ${POSTGRES_DB:-sportforalle}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- Uncomment once backend/ is scaffolded and has a Dockerfile -------------
